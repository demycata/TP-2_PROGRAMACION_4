@let p = publicacion();
<article class="publicacion">
  <header class="cabecera mono">
    <img class="avatar" [src]="p.autor.imagenPerfil" [alt]="'Foto de ' + p.autor.nombreUsuario" />
    <span class="nombre">{{ p.autor.nombre }} {{ p.autor.apellido }}</span>
    <span class="usuario">&#64;{{ p.autor.nombreUsuario }}</span>
    <span class="separador">·</span>
    <span class="hash">{{ p._id | hashCorto }}</span>
    <span class="separador">·</span>
    <span class="fecha" [title]="p.createdAt | date: 'dd/MM/yyyy · HH:mm'">{{ p.createdAt | tiempoRelativo }}</span>
    <span class="espacio"></span>
    @if (p.etiqueta; as etiqueta) {
      <span class="chip-etiqueta" [class]="'color-' + etiqueta">#{{ etiqueta }}</span>
    }
    @if (esMia()) {
      <button class="eliminar" type="button" title="Eliminar" aria-label="Eliminar publicación" (click)="eliminar.emit(p)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" />
        </svg>
      </button>
    }
  </header>

  <div class="contenido">
    <h3><a [routerLink]="['/publicaciones', p._id]">{{ p.titulo }}</a></h3>
    <p class="mensaje">{{ p.mensaje }}</p>
  </div>

  @if (p.imagen; as imagen) {
    <img class="imagen" [src]="imagen" [alt]="p.titulo" loading="lazy" />
  }

  <footer class="acciones">
    <app-me-gusta [publicacion]="p" />
    <span class="espacio"></span>
    <button
      #link="copiarLink"
      class="compartir"
      type="button"
      title="Copiar el link de la publicación"
      [appCopiarLink]="'/publicaciones/' + p._id"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 3 10 14M21 3l-7 18-4-7-7-4z" />
      </svg>
      @switch (link.estado()) {
        @case ('copiado') {
          Link copiado
        }
        @case ('error') {
          No se pudo copiar
        }
        @default {
          Compartir
        }
      }
    </button>
  </footer>
</article>
