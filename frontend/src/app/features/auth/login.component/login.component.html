<app-auth-layout>
  <form class="formulario" [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
    <div class="encabezado">
      <h2>Ingresá a commit</h2>
      <p class="muted">Usá tu usuario de la facultad.</p>
    </div>

    <label class="campo">
      <span>Usuario</span>
      <input class="input" formControlName="nombreUsuario" autocomplete="username" />
      @if (form.controls.nombreUsuario.touched && form.controls.nombreUsuario.invalid) {
        <small class="error">El nombre de usuario es obligatorio.</small>
      }
    </label>

    <div class="campo">
      <span class="etiqueta-password">
        <label for="password">Contraseña</label>
        <button class="alternar" type="button" (click)="alternarPassword()">
          {{ mostrarPassword() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </span>
      <input
        id="password"
        class="input"
        [type]="mostrarPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error">La contraseña es obligatoria.</small>
      }
    </div>

    @if (error(); as mensaje) {
      <div class="aviso aviso-error" role="alert">{{ mensaje }}</div>
    }
    @if (exito(); as mensaje) {
      <div class="aviso aviso-ok" role="status">{{ mensaje }}</div>
    }

    <button class="btn btn-primario" type="submit" [disabled]="enviado()">
      {{ enviado() ? 'Ingresando…' : 'Ingresar' }}
    </button>

    <p class="pie">¿No tenés cuenta? <a routerLink="/registro">Creá una</a></p>
  </form>
</app-auth-layout>
